testing:
  sampling:
    measurements_count: 10
    total_duration_seconds: 5
    sampling_frequency_hz: 2

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

analysis:
  statistical_metrics:
    - mean
    - median
    - std_dev
    - min
    - max
  visualization:
    enabled: false
    plot_types:

result_management:
  runs_directory: results/runs
  logs_directory: results/logs
  plots_directory: results/plots
